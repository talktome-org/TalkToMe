# fly.toml app configuration file generated for bobo on 2025-11-10T01:05:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bobo-app'
primary_region = 'iad'

[build]

[processes]
  app = "uvicorn Backend.app:app --host 0.0.0.0 --port 8080 --proxy-headers --forwarded-allow-ips='*' --workers 1"
  voiceagent = "python -m Backend.voice_agent.worker start"

[http_service]
  internal_port = 8080
  force_https = true
  # WebSockets (Realtime + streaming) are much more reliable if we don't scale-to-zero during development.
  # This prevents the proxy from repeatedly trying to start stopped machines (rate limit / lease contention).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[env]
  WEB_CONCURRENCY = "1"
  BACKEND_INTERNAL_URL = "http://bobo-app.internal:8080"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  processes = ['voiceagent']

