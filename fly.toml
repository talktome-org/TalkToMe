# fly.toml app configuration file generated for talktome on 2025-11-10T01:05:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'talktome'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[env]
  WEB_CONCURRENCY = "1"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[deploy]
  release_command = "sh -lc 'cd /app && python -m alembic -c Backend/alembic.ini upgrade head'"
